schema_version: "1.0"
suite_id: memory-contract-v1
name: Memory retrieval contract declaration
description: Capability-negative hybrid declaration for a Subject without ranked retrieval.
tags:
  - memory
  - contract-only
defaults:
  trials: 1
  timeout_seconds: 120
  preserve_sandbox: false
  metadata: {}
cases:
  - case_id: retrieve-stable-preference
    name: Retrieve a synthetic stable preference
    description: Demonstrates provider-independent retrieval inputs and ranked results.
    mode: scripted_multi_turn
    tags:
      - retrieval
    input:
      turns:
        - role: user
          message: My synthetic report preference is a concise Markdown table.
        - role: user
          message: What report format did I request?
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets: []
      memory_strategy: hybrid
      config_overrides: {}
      environment_overrides: {}
    fixture:
      files: []
      memory:
        items:
          - memory_id: preference-report-format
            kind: user_profile
            content: Synthetic user prefers concise Markdown tables for reports.
            source: audit-fixture
            metadata:
              confidence: declared
      skills: []
      review_requests: []
    expected:
      memories:
        - query_id: preference-format-query
          phase: before_conversation
          query:
            query: preferred report format
            top_k: 3
          required_memory_ids:
            - preference-report-format
          required_kinds:
            - user_profile
          minimum_matches: 1
      texts:
        - target: final_output
          contains: Markdown table
          case_sensitive: false
    evaluators:
      - evaluator_id: preference-answer
        kind: deterministic
        required: true
        config:
          expectation_group: texts
      - evaluator_id: preference-retrieval
        kind: retrieval
        required: true
