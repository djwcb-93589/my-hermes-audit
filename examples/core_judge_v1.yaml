schema_version: "1.0"
suite_id: core_judge_v1
name: Core answer-quality experiment
description: Synthetic P2 cases combining local gates with one versioned LLM Judge.
tags:
  - p2
  - judge
  - langfuse
defaults:
  trials: 1
  timeout_seconds: 120
  preserve_sandbox: false
  metadata:
    data_classification: synthetic
cases:
  - case_id: exact-format
    name: Exact text formatting
    mode: single_turn
    input:
      message: Reply with exactly AUDIT_READY and no other text.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets: []
    expected:
      texts:
        - target: final_output
          exact: AUDIT_READY
      judges:
        - rubric: >
            Evaluate whether the candidate gives exactly the requested readiness token
            without adding unsupported claims or extra formatting.
          criteria:
            - name: correctness
              description: The response contains the exact requested token.
              weight: 0.5
            - name: completeness
              description: The requested response is fully present.
              weight: 0.2
            - name: instruction_following
              description: The response contains no extra text or formatting.
              weight: 0.3
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: exact-output
        kind: deterministic
        required: true
        config:
          expectation_group: texts
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0

  - case_id: read-workspace-file
    name: Read and report a synthetic reference
    mode: single_turn
    input:
      message: Read input/note.txt with the file tool and report its reference code.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets:
        - file
    fixture:
      files:
        - path: workspace/input/note.txt
          content: "Synthetic reference code: ORBIT-17.\n"
    expected:
      texts:
        - target: final_output
          contains: ORBIT-17
      tool_trajectories:
        - required_tools:
            - file
          minimum_tool_calls: 1
          required_successful_tools:
            - file
      judges:
        - rubric: >
            Evaluate whether the candidate accurately reports the synthetic reference
            established by deterministic and tool evidence.
          criteria:
            - name: correctness
              description: The response reports ORBIT-17 without contradiction.
              weight: 0.5
            - name: completeness
              description: The response clearly identifies the requested reference code.
              weight: 0.3
            - name: instruction_following
              description: The response directly answers the file-reading request.
              weight: 0.2
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: reference-answer
        kind: deterministic
        required: true
        config:
          expectation_group: texts
      - evaluator_id: file-read-trace
        kind: tool_trajectory
        required: true
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0

  - case_id: create-text-file
    name: Create and explain a synthetic text artifact
    mode: single_turn
    input:
      message: >
        Use the file tool to create output/summary.txt containing exactly
        synthetic audit summary followed by a newline, then briefly confirm the result.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets:
        - file
    expected:
      files:
        - path: workspace/output/summary.txt
          exists: true
          exact_text: "synthetic audit summary\n"
          minimum_size_bytes: 10
          maximum_size_bytes: 128
      tool_trajectories:
        - required_tools:
            - file
          minimum_tool_calls: 1
          required_successful_tools:
            - file
      judges:
        - rubric: >
            Evaluate whether the candidate's confirmation accurately describes the
            file operation established by trusted runtime evidence.
          criteria:
            - name: correctness
              description: The response does not contradict the verified file result.
              weight: 0.5
            - name: completeness
              description: The response identifies the created artifact and outcome.
              weight: 0.3
            - name: instruction_following
              description: The confirmation is brief as requested.
              weight: 0.2
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: summary-file
        kind: deterministic
        required: true
        config:
          expectation_group: files
      - evaluator_id: file-write-trace
        kind: tool_trajectory
        required: true
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0

  - case_id: transform-json-file
    name: Transform and explain synthetic JSON
    mode: single_turn
    input:
      message: >
        Read input/source.json, write output/result.json with name unchanged and
        active set to true, then state what changed.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets:
        - file
    fixture:
      files:
        - path: workspace/input/source.json
          content: |
            {"name":"synthetic-record","active":false}
    expected:
      json_values:
        - target: workspace/output/result.json
          root_type: object
          required_keys:
            - name
            - active
          values:
            - path: name
              expected: synthetic-record
            - path: active
              expected: true
          forbidden_keys:
            - secret
      tool_trajectories:
        - required_tools:
            - file
          minimum_tool_calls: 2
          required_successful_tools:
            - file
      judges:
        - rubric: >
            Evaluate whether the response correctly explains the verified JSON
            transformation without inventing fields or side effects.
          criteria:
            - name: correctness
              description: The response agrees with the verified JSON values.
              weight: 0.5
            - name: completeness
              description: The response mentions the active-state change and preserved name.
              weight: 0.3
            - name: instruction_following
              description: The response states the change directly.
              weight: 0.2
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: transformed-json
        kind: deterministic
        required: true
        config:
          expectation_group: json_values
      - evaluator_id: json-file-trace
        kind: tool_trajectory
        required: true
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0

  - case_id: harmless-terminal
    name: Run and report a harmless terminal command
    mode: single_turn
    input:
      message: >
        Use the terminal tool to run python -c "print('AUDIT_OK')" and report
        the observed output.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets:
        - terminal
    expected:
      texts:
        - target: final_output
          contains: AUDIT_OK
      tool_trajectories:
        - required_tools:
            - terminal
          minimum_tool_calls: 1
          maximum_tool_calls: 3
          required_successful_tools:
            - terminal
      judges:
        - rubric: >
            Evaluate whether the response accurately reports the terminal outcome
            established by trusted runtime evidence.
          criteria:
            - name: correctness
              description: The response reports AUDIT_OK without contradiction.
              weight: 0.5
            - name: completeness
              description: The observed command result is clearly stated.
              weight: 0.3
            - name: instruction_following
              description: The response focuses on the requested terminal outcome.
              weight: 0.2
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: terminal-answer
        kind: deterministic
        required: true
        config:
          expectation_group: texts
      - evaluator_id: terminal-trace
        kind: tool_trajectory
        required: true
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0

  - case_id: fixed-two-turn
    name: Preserve and report fixed multi-turn context
    mode: scripted_multi_turn
    input:
      turns:
        - role: user
          message: Remember the synthetic code COMET-42. Reply only ACK.
        - role: user
          message: Reply with only the code I asked you to remember.
    execution:
      runner: conversation
      workdir: workspace
      enabled_toolsets: []
    expected:
      texts:
        - target: final_output
          exact: COMET-42
      judges:
        - rubric: >
            Evaluate whether the final response preserves the trusted scripted context
            and follows the exact-output constraint.
          criteria:
            - name: correctness
              description: The response gives the remembered code COMET-42.
              weight: 0.5
            - name: completeness
              description: The requested code is fully present.
              weight: 0.2
            - name: instruction_following
              description: The response contains only the requested code.
              weight: 0.3
          minimum_score: 0.7
          maximum_score: 1.0
    evaluators:
      - evaluator_id: multi-turn-context
        kind: deterministic
        required: true
        config:
          expectation_group: texts
      - evaluator_id: answer-quality
        kind: llm_judge
        required: true
        config:
          rubric_ref: judges.0
