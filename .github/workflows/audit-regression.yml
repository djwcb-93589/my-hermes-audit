name: Audit representative regression

on:
  workflow_dispatch:
    inputs:
      subject_repository:
        description: Repository containing the reviewed MyHermes Subject
        required: true
        type: string
      subject_ref:
        description: Immutable or reviewed Subject ref
        required: true
        default: main
        type: string
      subject_config_path:
        description: Secret-free config path relative to the Subject checkout
        required: true
        default: configs/audit-ci.yaml
        type: string
      baseline_path:
        description: Versioned, checked-in read-only Baseline path in this repository
        required: true
        type: string
      trials:
        description: Explicit representative Trial count (1-100)
        required: true
        default: '5'
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Prepare the Audit Worker environment
        id: audit_environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .p8-ci
          if ! uv sync --locked > "$RUNNER_TEMP/audit-environment.log" 2>&1; then
            printf '%s\n' '{"artifact_manifest_version":"p8-ci-safe-manifest-v1","artifact_status":"unavailable","stage":"audit_environment","reason":"audit_dependency_install_failed","exit_code":2}' > .p8-ci/safe-artifact-manifest.json
            printf '%s\n' 'artifact_status=unavailable' 'stage=audit_environment' 'reason=audit_dependency_install_failed' 'exit_code=2' 'details=redacted' > .p8-ci/console-summary.txt
            printf '%s\n' 'status=failed stage=audit_environment reason=audit_dependency_install_failed details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          test -x "$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Require explicitly supplied model credentials
        id: credential_preflight
        shell: bash
        env:
          MYHERMES_API_KEY: ${{ secrets.MYHERMES_API_KEY }}
          MYHERMES_MODEL: ${{ secrets.MYHERMES_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${MYHERMES_API_KEY:-}" || -z "${MYHERMES_MODEL:-}" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
          printf '%s\n' 'baseline_mode=readonly credential_check=present' >> "$GITHUB_STEP_SUMMARY"

      - name: Record missing credential skip safely
        if: always() && steps.credential_preflight.outputs.run == 'false'
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.venv/bin/python" tools/p8_ci_support.py write-failure-artifacts \
            --manifest .p8-ci/safe-artifact-manifest.json \
            --console .p8-ci/console-summary.txt \
            --stage credential_preflight \
            --reason missing_model_credentials \
            --exit-code 0
          printf '%s\n' 'status=skipped reason=missing_model_credentials' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout reviewed Subject
        if: steps.credential_preflight.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.subject_repository }}
          ref: ${{ inputs.subject_ref }}
          token: ${{ secrets.MYHERMES_READ_TOKEN || github.token }}
          path: my-hermes
          persist-credentials: false

      - name: Validate dispatch inputs before use
        if: steps.credential_preflight.outputs.run == 'true'
        id: input_validation
        shell: bash
        env:
          SUBJECT_CONFIG_INPUT: ${{ inputs.subject_config_path }}
          TRIALS_INPUT: ${{ inputs.trials }}
          BASELINE_INPUT: ${{ inputs.baseline_path }}
        run: |
          set -euo pipefail
          audit_python="$GITHUB_WORKSPACE/.venv/bin/python"
          if ! "$audit_python" tools/p8_ci_support.py validate-trials \
            --value "$TRIALS_INPUT" --github-output "$GITHUB_OUTPUT"; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage dispatch_input_validation \
              --reason invalid_trials \
              --exit-code 2
            printf '%s\n' 'status=failed stage=dispatch_input_validation reason=invalid_trials details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! "$audit_python" tools/p8_ci_support.py validate-subject-config \
            --root "$GITHUB_WORKSPACE/my-hermes" \
            --value "$SUBJECT_CONFIG_INPUT" \
            --github-output "$GITHUB_OUTPUT"; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage dispatch_input_validation \
              --reason invalid_subject_config \
              --exit-code 2
            printf '%s\n' 'status=failed stage=dispatch_input_validation reason=invalid_subject_config details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! "$audit_python" tools/p8_ci_support.py validate-baseline \
            --root "$GITHUB_WORKSPACE" \
            --value "$BASELINE_INPUT" \
            --github-output "$GITHUB_OUTPUT"; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage dispatch_input_validation \
              --reason invalid_baseline \
              --exit-code 2
            printf '%s\n' 'status=failed stage=dispatch_input_validation reason=invalid_baseline details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: Install reviewed Subject into the Audit Worker environment
        if: steps.credential_preflight.outputs.run == 'true'
        id: subject_environment
        shell: bash
        run: |
          set -euo pipefail
          audit_python="$GITHUB_WORKSPACE/.venv/bin/python"
          requirements="$RUNNER_TEMP/my-hermes-requirements.txt"
          environment_log="$RUNNER_TEMP/subject-environment.log"
          if ! uv export --project "$GITHUB_WORKSPACE/my-hermes" --locked --no-dev --no-emit-project --format requirements-txt --output-file "$requirements" > "$environment_log" 2>&1; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage subject_environment \
              --reason subject_dependency_export_failed \
              --exit-code 2
            printf '%s\n' 'status=failed stage=subject_environment reason=subject_dependency_export_failed details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! uv pip install --python "$audit_python" --requirement "$requirements" >> "$environment_log" 2>&1; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage subject_environment \
              --reason subject_dependency_install_failed \
              --exit-code 2
            printf '%s\n' 'status=failed stage=subject_environment reason=subject_dependency_install_failed details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! uv pip install --python "$audit_python" --no-deps --editable "$GITHUB_WORKSPACE/my-hermes" >> "$environment_log" 2>&1; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage subject_environment \
              --reason subject_editable_install_failed \
              --exit-code 2
            printf '%s\n' 'status=failed stage=subject_environment reason=subject_editable_install_failed details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          if ! "$audit_python" -c 'import hermes' >> "$environment_log" 2>&1; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage subject_environment \
              --reason subject_import_preflight_failed \
              --exit-code 2
            printf '%s\n' 'status=failed stage=subject_environment reason=subject_import_preflight_failed details=redacted' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          printf '%s\n' 'subject_environment=ready interpreter=audit_worker_venv' >> "$GITHUB_STEP_SUMMARY"

      - name: Run current Benchmark without optional remote integrations
        if: steps.credential_preflight.outputs.run == 'true'
        id: benchmark
        shell: bash
        env:
          SUBJECT_CONFIG_PATH: ${{ steps.input_validation.outputs.subject_config_path }}
          TRIAL_COUNT: ${{ steps.input_validation.outputs.trials }}
          OPENAI_API_KEY: ${{ secrets.MYHERMES_API_KEY }}
          MODEL: ${{ secrets.MYHERMES_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.MYHERMES_BASE_URL }}
        run: |
          set -euo pipefail
          raw_log="$RUNNER_TEMP/regression-raw.log"
          set +e
          uv run --no-sync myhermes-audit run examples/representative_benchmark_v1.yaml \
            --subject-repo my-hermes \
            --subject-config "$SUBJECT_CONFIG_PATH" \
            --trials "$TRIAL_COUNT" \
            --output .p8-ci/current-result.json > "$raw_log" 2>&1
          run_status=$?
          set -e
          if [[ -f .p8-ci/current-result.json && ! -L .p8-ci/current-result.json ]]; then
            result_candidate=true
          else
            result_candidate=false
          fi
          echo 'completed=true' >> "$GITHUB_OUTPUT"
          echo "run_exit_code=$run_status" >> "$GITHUB_OUTPUT"
          echo "result_candidate=$result_candidate" >> "$GITHUB_OUTPUT"

      - name: Validate current facts, compare, and publish regression
        if: always() && steps.benchmark.outputs.completed == 'true'
        id: publication
        shell: bash
        env:
          RUN_EXIT_CODE: ${{ steps.benchmark.outputs.run_exit_code }}
          RESULT_CANDIDATE: ${{ steps.benchmark.outputs.result_candidate }}
          BASELINE_PATH: ${{ steps.input_validation.outputs.baseline_path }}
        run: |
          set -euo pipefail
          audit_python="$GITHUB_WORKSPACE/.venv/bin/python"
          publication_log="$RUNNER_TEMP/regression-publication.log"
          outcome_kind=failure
          artifact_kind=failure
          terminal_exit_code=2
          if [[ "$RESULT_CANDIDATE" != 'true' ]]; then
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage regression_publication \
              --reason strict_current_result_missing \
              --exit-code 2
          elif ! "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind run --path .p8-ci/current-result.json > "$publication_log" 2>&1; then
            rm -f -- .p8-ci/current-result.json
            "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --stage regression_publication \
              --reason strict_current_result_invalid \
              --exit-code 2
          elif [[ "$RUN_EXIT_CODE" == '0' || "$RUN_EXIT_CODE" == '1' ]]; then
            set +e
            uv run --no-sync myhermes-audit baseline compare "$BASELINE_PATH" \
              .p8-ci/current-result.json \
              --policy configs/regression-policy.yaml \
              --output .p8-ci/representative-regression.json > "$publication_log" 2>&1
            compare_exit_code=$?
            set -e
            if [[ "$compare_exit_code" != '0' && "$compare_exit_code" != '1' ]]; then
              rm -f -- .p8-ci/representative-regression.json
              if ! "$audit_python" tools/p8_ci_support.py write-run-artifacts \
                --result .p8-ci/current-result.json \
                --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
                --exit-code "$RUN_EXIT_CODE" \
                --exit-label current_run_exit_code; then
                "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
                  --manifest .p8-ci/safe-artifact-manifest.json \
                  --console .p8-ci/console-summary.txt \
                  --stage regression_publication \
                  --reason safe_projection_failed \
                  --exit-code 2
              else
                printf '%s\n' 'regression_status=unavailable' 'comparison_outcome=not_published' >> .p8-ci/console-summary.txt
              fi
            elif [[ ! -f .p8-ci/representative-regression.json || -L .p8-ci/representative-regression.json ]] || ! "$audit_python" tools/p8_ci_support.py validate-fact \
              --kind regression --path .p8-ci/representative-regression.json >> "$publication_log" 2>&1; then
              rm -f -- .p8-ci/representative-regression.json
              if ! "$audit_python" tools/p8_ci_support.py write-run-artifacts \
                --result .p8-ci/current-result.json \
                --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
                --exit-code "$RUN_EXIT_CODE" \
                --exit-label current_run_exit_code; then
                "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
                  --manifest .p8-ci/safe-artifact-manifest.json \
                  --console .p8-ci/console-summary.txt \
                  --stage regression_publication \
                  --reason safe_projection_failed \
                  --exit-code 2
              else
                printf '%s\n' 'regression_status=unavailable' 'comparison_outcome=invalid_strict_report' >> .p8-ci/console-summary.txt
              fi
            else
            set +e
            uv run --no-sync myhermes-audit report render .p8-ci/representative-regression.json \
              --input-type regression \
              --output .p8-ci/representative-regression.md >> "$publication_log" 2>&1
            render_exit_code=$?
            set -e
            if [[ "$render_exit_code" -ne 0 ]]; then
              rm -f -- .p8-ci/current-result.json .p8-ci/representative-regression.json .p8-ci/representative-regression.md
              "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
                --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
                --stage regression_publication \
                --reason strict_regression_render_failed \
                --exit-code 2
            elif ! "$audit_python" tools/p8_ci_support.py write-regression-artifacts \
              --result .p8-ci/current-result.json \
              --regression .p8-ci/representative-regression.json \
              --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
              --run-exit-code "$RUN_EXIT_CODE" \
              --compare-exit-code "$compare_exit_code" \
              --github-output "$GITHUB_OUTPUT"; then
              rm -f -- .p8-ci/current-result.json .p8-ci/representative-regression.json .p8-ci/representative-regression.md
              "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
                --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
                --stage regression_publication \
                --reason safe_projection_failed \
                --exit-code 2
            else
              outcome_kind=regression
              artifact_kind=complete
              terminal_exit_code=0
            fi
            fi
          else
            if ! "$audit_python" tools/p8_ci_support.py write-run-artifacts \
              --result .p8-ci/current-result.json \
              --manifest .p8-ci/safe-artifact-manifest.json \
              --console .p8-ci/console-summary.txt \
              --exit-code "$RUN_EXIT_CODE" \
              --exit-label current_run_exit_code; then
              "$audit_python" tools/p8_ci_support.py write-failure-artifacts \
                --manifest .p8-ci/safe-artifact-manifest.json \
                --console .p8-ci/console-summary.txt \
                --stage regression_publication \
                --reason safe_projection_failed \
                --exit-code 2
            else
              printf '%s\n' 'regression_status=not_run' 'comparison_outcome=current_run_not_comparable' >> .p8-ci/console-summary.txt
            fi
            case "$RUN_EXIT_CODE" in
              2|3) terminal_exit_code="$RUN_EXIT_CODE" ;;
              *) terminal_exit_code=2 ;;
            esac
          fi
          printf '%s\n' "current_run_exit_code=$RUN_EXIT_CODE outcome_kind=$outcome_kind terminal_exit_code=$terminal_exit_code" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'baseline_updated=false judge=disabled langfuse=disabled pricing=policy-only' >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_kind=$artifact_kind" >> "$GITHUB_OUTPUT"
          echo "outcome_kind=$outcome_kind" >> "$GITHUB_OUTPUT"
          echo "terminal_exit_code=$terminal_exit_code" >> "$GITHUB_OUTPUT"

      - name: Record strict regression decision safely
        if: always() && steps.publication.outputs.outcome_kind == 'regression'
        shell: bash
        env:
          CURRENT_RUN_EXIT_CODE: ${{ steps.benchmark.outputs.run_exit_code }}
          CURRENT_FAILED_CASE_COUNT: ${{ steps.publication.outputs.current_failed_case_count }}
          REGRESSION_STATUS: ${{ steps.publication.outputs.regression_status }}
        run: |
          set -euo pipefail
          printf '%s\n' "current_run_exit_code=$CURRENT_RUN_EXIT_CODE current_failed_case_count=$CURRENT_FAILED_CASE_COUNT regression_status=$REGRESSION_STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Record regression failure safely
        if: always() && (steps.publication.outputs.outcome_kind == 'failure' || steps.publication.outputs.regression_gate_exit_code == '1')
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'status=failed stage=representative_regression details=redacted' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare regression completed Artifact whitelist
        if: always() && steps.publication.outputs.artifact_kind == 'complete'
        id: completed_artifact_contract
        shell: bash
        run: |
          set -euo pipefail
          audit_python="$GITHUB_WORKSPACE/.venv/bin/python"
          "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind run --path .p8-ci/current-result.json
          "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind regression --path .p8-ci/representative-regression.json
          "$audit_python" - <<'PY'
          import json
          from pathlib import Path

          from myhermes_audit.artifacts import atomic_write_json

          files = (
              ".p8-ci/current-result.json",
              ".p8-ci/representative-regression.json",
              ".p8-ci/representative-regression.md",
              ".p8-ci/safe-artifact-manifest.json",
              ".p8-ci/console-summary.txt",
          )
          paths = [Path(value) for value in files]
          if any(path.is_symlink() or not path.is_file() for path in paths):
              raise SystemExit("regression artifact contract failed")
          manifest = json.loads(paths[-2].read_text(encoding="utf-8"))
          if not isinstance(manifest, dict):
              raise SystemExit("regression manifest contract failed")
          manifest["artifact_status"] = "complete"
          manifest["files"] = list(files)
          atomic_write_json(paths[-2], manifest)
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Prepare regression status Artifact whitelist
        if: always() && (steps.publication.outputs.artifact_kind != 'complete' || steps.completed_artifact_contract.outputs.ready != 'true')
        id: status_artifact_contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = (
              ".p8-ci/safe-artifact-manifest.json",
              ".p8-ci/console-summary.txt",
          )
          paths = [Path(value) for value in files]
          if any(path.is_symlink() or not path.is_file() for path in paths):
              raise SystemExit("regression status artifact contract failed")
          manifest = json.loads(paths[0].read_text(encoding="utf-8"))
          if not isinstance(manifest, dict):
              raise SystemExit("regression status manifest contract failed")
          manifest["files"] = list(files)
          paths[0].write_text(
              json.dumps(manifest, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload regression completed safe artifacts
        if: always() && steps.completed_artifact_contract.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: representative-regression-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .p8-ci/current-result.json
            .p8-ci/representative-regression.json
            .p8-ci/representative-regression.md
            .p8-ci/safe-artifact-manifest.json
            .p8-ci/console-summary.txt

      - name: Upload regression status artifacts
        if: always() && steps.status_artifact_contract.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: representative-regression-status-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .p8-ci/safe-artifact-manifest.json
            .p8-ci/console-summary.txt

      - name: Apply regression final gate
        if: always() && steps.publication.outputs.outcome_kind != ''
        shell: bash
        env:
          OUTCOME_KIND: ${{ steps.publication.outputs.outcome_kind }}
          TERMINAL_EXIT_CODE: ${{ steps.publication.outputs.terminal_exit_code }}
          REGRESSION_GATE_EXIT_CODE: ${{ steps.publication.outputs.regression_gate_exit_code }}
        run: |
          set -euo pipefail
          case "$OUTCOME_KIND" in
            regression)
              case "$REGRESSION_GATE_EXIT_CODE" in
                0|1) exit "$REGRESSION_GATE_EXIT_CODE" ;;
                *) exit 2 ;;
              esac
              ;;
            failure)
              case "$TERMINAL_EXIT_CODE" in
                1|2|3) exit "$TERMINAL_EXIT_CODE" ;;
                *) exit 2 ;;
              esac
              ;;
            *) exit 2 ;;
          esac
