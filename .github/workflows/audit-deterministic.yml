name: Audit deterministic contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Strict deterministic checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          mkdir -p .p8-ci
          uv run python -m compileall -q src
          uv run myhermes-audit --help > .p8-ci/cli-help.txt
          uv run myhermes-audit report render --help > .p8-ci/report-render-help.txt
          uv run myhermes-audit schema --output .p8-ci/audit-suite.schema.json > /dev/null
          uv run myhermes-audit validate examples/representative_benchmark_v1.yaml > .p8-ci/representative-suite-validation.txt
          uv run python - <<'PY'
          from pathlib import Path
          from myhermes_audit.contracts import (
              AuditBaseline,
              AuditRegressionReport,
              AuditRunResult,
              ReportRenderOptions,
          )
          from myhermes_audit.serialization import pretty_json

          Path(".p8-ci/strict-contract-schemas.json").write_text(
              pretty_json(
                  {
                      "audit_run_result": AuditRunResult.model_json_schema(),
                      "audit_baseline": AuditBaseline.model_json_schema(),
                      "audit_regression_report": AuditRegressionReport.model_json_schema(),
                      "report_render_options": ReportRenderOptions.model_json_schema(),
                  }
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          uv run --no-sync python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          from pydantic import ValidationError

          from myhermes_audit.artifacts import atomic_write_validated_model_json
          from myhermes_audit.contracts import (
              AuditBaseline,
              AuditRegressionReport,
              AuditRunResult,
              ReportInputType,
          )
          from myhermes_audit.contracts.fingerprint import (
              AuditFingerprint,
              SubjectFingerprint,
          )
          from myhermes_audit.contracts.result import (
              TrialObservationSummary,
              TrialResult,
              TrialRuntimeSummary,
              TrialStatus,
          )
          from myhermes_audit.errors import ReportError
          from myhermes_audit.integrations.myhermes.contracts import (
              WORKER_PROTOCOL_VERSION,
          )
          from myhermes_audit.regression import (
              RegressionPolicy,
              build_baseline,
              compare_baseline,
          )
          from myhermes_audit.reports.aggregate import (
              aggregate_audit,
              aggregate_cases,
          )
          from myhermes_audit.reports.markdown import (
              load_markdown_report_source,
              write_markdown_report,
          )

          output = Path(".p8-ci")
          timestamp = datetime(2026, 8, 6, tzinfo=timezone.utc)
          trial = TrialResult(
              trial_id="ci-smoke-trial-1",
              run_id="ci-smoke-worker-run-1",
              case_id="ci-smoke-case",
              trial_number=1,
              status=TrialStatus.COMPLETED,
              task_passed=True,
              passed=True,
              duration_ms=1,
              runtime=TrialRuntimeSummary(
                  subject_model="ci-smoke-model",
                  iterations=1,
                  tool_call_count=0,
                  model_call_count=0,
              ),
              observations=TrialObservationSummary(
                  worker_protocol_version=WORKER_PROTOCOL_VERSION,
              ),
          )
          result = AuditRunResult(
              schema_version="1.7",
              run_id="ci-smoke-run",
              suite_id="ci-smoke-suite",
              subject_fingerprint=SubjectFingerprint(
                  repository="ci-synthetic",
                  git_commit="0" * 40,
                  dirty=False,
                  python_requirement=">=3.13",
              ),
              audit_fingerprint=AuditFingerprint(
                  audit_version="0.1.0",
                  audit_commit="1" * 40,
                  suite_sha256="2" * 64,
                  suite_comparison_sha256="2" * 64,
                  python_version="3.13",
                  platform="ci",
                  created_at=timestamp,
              ),
              run_configuration_fingerprint="3" * 64,
              started_at=timestamp,
              finished_at=timestamp,
              trials=[trial],
              cases=aggregate_cases(["ci-smoke-case"], [trial]),
              summary=aggregate_audit(["ci-smoke-case"], [trial]),
          )
          baseline = build_baseline(result)
          regression = compare_baseline(
              baseline,
              result,
              RegressionPolicy.conservative_default(),
          )
          paths = {
              "run": output / "contract-smoke-result.json",
              "baseline": output / "contract-smoke-baseline.json",
              "regression": output / "contract-smoke-regression.json",
          }
          atomic_write_validated_model_json(paths["run"], result)
          atomic_write_validated_model_json(paths["baseline"], baseline)
          atomic_write_validated_model_json(paths["regression"], regression)
          loaded = {
              "run": AuditRunResult.model_validate_json(paths["run"].read_text(encoding="utf-8")),
              "baseline": AuditBaseline.model_validate_json(paths["baseline"].read_text(encoding="utf-8")),
              "regression": AuditRegressionReport.model_validate_json(paths["regression"].read_text(encoding="utf-8")),
          }
          for kind, input_type in (
              ("run", ReportInputType.RUN),
              ("baseline", ReportInputType.BASELINE),
              ("regression", ReportInputType.REGRESSION),
          ):
              source = load_markdown_report_source(paths[kind], input_type=input_type)
              if source != loaded[kind]:
                  raise AssertionError(f"strict {kind} reload changed the fact")
              write_markdown_report(output / f"contract-smoke-{kind}.md", source)
          try:
              write_markdown_report(output / "contract-smoke-run.md", loaded["run"])
          except ReportError:
              pass
          else:
              raise AssertionError("Markdown overwrite must be rejected")
          wrong_schema = result.model_dump_json().replace('"1.7"', '"wrong-schema"', 1)
          try:
              AuditRunResult.model_validate_json(wrong_schema)
          except ValidationError:
              pass
          else:
              raise AssertionError("wrong Result schema must be rejected")
          PY
          while IFS= read -r baseline; do
            stem="$(basename "${baseline%.json}")"
            uv run myhermes-audit report render "$baseline" \
              --input-type baseline \
              --output ".p8-ci/${stem}.md" > /dev/null
          done < <(git ls-files 'baselines/*.json')
          printf '%s\n' 'status=completed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'network=model-disabled langfuse-disabled baseline-mutation-disabled' >> "$GITHUB_STEP_SUMMARY"

      - name: Tracked-file secret safety scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -q -I -E '(sk-[A-Za-z0-9_-]{16,}|LF_SECRET_KEY[[:space:]]*=[^$]|MYHERMES_API_KEY[[:space:]]*=[^$])' -- .; then
            printf '%s\n' 'status=failed reason=tracked_secret_pattern_detected' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' 'secret_scan=passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare deterministic safe artifact publication
        if: success()
        id: completed_artifact_contract
        shell: bash
        run: |
          set -euo pipefail
          audit_python="$GITHUB_WORKSPACE/.venv/bin/python"
          "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind run --path .p8-ci/contract-smoke-result.json
          "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind baseline --path .p8-ci/contract-smoke-baseline.json
          "$audit_python" tools/p8_ci_support.py validate-fact \
            --kind regression --path .p8-ci/contract-smoke-regression.json
          "$audit_python" - <<'PY'
          import json
          from pathlib import Path

          from myhermes_audit.artifacts import atomic_write_json, atomic_write_text

          files = (
              ".p8-ci/contract-smoke-result.json",
              ".p8-ci/contract-smoke-baseline.json",
              ".p8-ci/contract-smoke-regression.json",
              ".p8-ci/contract-smoke-run.md",
              ".p8-ci/contract-smoke-baseline.md",
              ".p8-ci/contract-smoke-regression.md",
              ".p8-ci/safe-artifact-manifest.json",
              ".p8-ci/console-summary.txt",
          )
          for value in files[:-2]:
              path = Path(value)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("deterministic artifact contract failed")
          manifest = {
              "artifact_manifest_version": "p8-ci-safe-manifest-v1",
              "artifact_status": "complete",
              "fact_source": [
                  "AuditRunResult",
                  "AuditBaseline",
                  "AuditRegressionReport",
              ],
              "files": list(files),
          }
          atomic_write_json(Path(files[-2]), manifest)
          atomic_write_text(
              Path(files[-1]),
              "\n".join(
                  (
                      "artifact_status=complete",
                      "strict_result=validated",
                      "strict_baseline=validated",
                      "strict_regression=validated",
                      "markdown=derived_from_strict_json",
                      "judge=disabled",
                      "langfuse=disabled",
                  )
              )
              + "\n",
          )
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Record deterministic failure artifacts safely
        if: failure() && steps.completed_artifact_contract.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .p8-ci
          printf '%s\n' '{"artifact_manifest_version":"p8-ci-safe-manifest-v1","artifact_status":"unavailable","stage":"deterministic_contracts","reason":"deterministic_contract_failed","exit_code":1,"files":[".p8-ci/safe-artifact-manifest.json",".p8-ci/console-summary.txt"]}' > .p8-ci/safe-artifact-manifest.json
          printf '%s\n' 'artifact_status=unavailable' 'stage=deterministic_contracts' 'reason=deterministic_contract_failed' 'exit_code=1' 'details=redacted' > .p8-ci/console-summary.txt
          printf '%s\n' 'status=failed stage=deterministic_contracts details=redacted' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic completed safe artifacts
        if: always() && steps.completed_artifact_contract.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-deterministic-${{ github.sha }}-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .p8-ci/contract-smoke-result.json
            .p8-ci/contract-smoke-baseline.json
            .p8-ci/contract-smoke-regression.json
            .p8-ci/contract-smoke-run.md
            .p8-ci/contract-smoke-baseline.md
            .p8-ci/contract-smoke-regression.md
            .p8-ci/safe-artifact-manifest.json
            .p8-ci/console-summary.txt

      - name: Upload deterministic failure summary
        if: always() && failure() && steps.completed_artifact_contract.outputs.ready != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-deterministic-failure-${{ github.sha }}-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .p8-ci/safe-artifact-manifest.json
            .p8-ci/console-summary.txt
